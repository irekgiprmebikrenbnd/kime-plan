          sets: 6, isContrast: false, contrastRestSec: 0, fullRestSec: 90, workSec: 20,
          cueA: 'Fire 2–3 razor-sharp 1-second blitz entries per round with immediate angle exit.',
          cueB: null, logKey: null, exId: 'shadow_kumite'
        }]
      }
    };

    const MAT = {
      open: false,
      sourceKey: 'day:1',
      headerTitle: '',
      steps: [],
      stepIdx: 0,
      curSet: 1,
      phase: 'READY', // 'READY' | 'WORK' | 'CONTRAST_REST' | 'CONTRAST_WORK' | 'FULL_REST' | 'COMPLETE'
      remaining: 0,
      running: false,
      tickId: null,
      wakeLock: null
    };

    function parseRestSeconds(rx) {
      const s = rx || '';
      const minM = s.match(/(\d+(?:\.\d+)?)\s*m(?:\s*rest|\b)/i);
      if (minM) return Math.round(parseFloat(minM[1]) * 60);
      const secMatches = [...s.matchAll(/(\d+)\s*s\s*rest/gi)];
      if (secMatches.length) return parseInt(secMatches[secMatches.length - 1][1], 10);
      return 90;
    }

    function parseSetsCount(rx) {
      const m = (rx || '').match(/(\d+)\s*x\b/i);
      if (m) return Math.max(1, Math.min(12, parseInt(m[1], 10)));
      return 3;
    }

    function parseWorkSec(rx) {
      const mMin = (rx || '').match(/\d+\s*x\s*(\d+)-?min/i);
      if (mMin) return parseInt(mMin[1], 10) * 60;
      const mSec = (rx || '').match(/\d+\s*x\s*(\d+)s\b/i);
      if (mSec) return parseInt(mSec[1], 10);
      return 0;
    }

    function driveCue(exId, resolvedLib = null) {
      const lib = resolvedLib || EXERCISE_LIBRARY[exId];
      const h = lib?.howTo?.[1] || lib?.howTo?.[0] || 'Execute with 100% velocity intent and zero tension.';
      return h.replace(/^(Drive|Step-by-Step Execution):\s*/i, '');
    }

    function buildMatStepsFromDay(dayNum) {
      const dObj = DAYS_DATA.find(d => d.day === dayNum) || DAYS_DATA[0];
      const steps = [];
      const exs = dObj.exercises || [];

      for (let i = 0; i < exs.length; i++) {
        const cur = exs[i];
        const resA = resolveExercise(cur, dObj);
        const lib = resA?.lib;
        if (!lib) continue;
        const rx = resA.rx || '';
        const logKey = `d${dObj.day}_i${i}`;
        const sets = parseSetsCount(rx);
        const fullRestSec = parseRestSeconds(rx);
        const workSec = parseWorkSec(rx);

        // Detect paired next item (e.g., Day 8 Contrast Pair A, Day 10 Contrast A/B, Day 15 Peak Contrast)
        const next = exs[i + 1];
        const resB = next ? resolveExercise(next, dObj) : null;
        const nextIsPairPartner = next && (/Contrast Pair/i.test(next.rx) || (/Peak Contrast/i.test(rx) && next.id === 'broad_jump'));
        const inlineContrastSec = rx.match(/\+\s*(\d+)s\s*\+/i);
        const isInlineContrast = /Contrast|resisted\s*\+|Heavy Lateral Lunge|Leg Ext Iso Hold|DB contrast|Machine punches|Hikite rips/i.test(rx) && !nextIsPairPartner;

        if (nextIsPairPartner) {
          const libB = resB?.lib;
          const cRest = inlineContrastSec ? parseInt(inlineContrastSec[1], 10) : 60;
          steps.push({
            title: lib.name,
            contrastTitle: libB ? libB.name : 'Explosive Contrast Pair',
            rx,
            sets,
            isContrast: true,
            contrastRestSec: cRest,
            fullRestSec,
            workSec: 0,
            cueA: driveCue(cur.id, lib),
            cueB: libB ? driveCue(next.id, libB) : 'Explode at 100% velocity intent.',
            logKey,
            exId: cur.id,
            resolvedLib: lib,
            syncMetric: resA.allowBenchmarkSync ? (cur.syncMetric || null) : null
          });
          i++; // skip partner row since merged into contrast pair
        } else if (isInlineContrast) {
          const cRest = inlineContrastSec ? parseInt(inlineContrastSec[1], 10) : (/resisted|DB|Machine/i.test(rx) ? 20 : 45);
          steps.push({
            title: lib.name,
            contrastTitle: /Leg Ext Iso Hold/i.test(rx)
              ? 'Unloaded Maximal Kamae Pursuit Blitz'
              : (/resisted|DB|Machine/i.test(rx) ? 'Unloaded Overspeed Reps (Drop Load)' : 'Explosive Contrast Movement'),
            rx,
            sets,
            isContrast: true,
            contrastRestSec: cRest,
            fullRestSec,
            workSec: 0,
            cueA: driveCue(cur.id, lib),
            cueB: 'Immediately exploit PAP—move at 100% maximal speed with zero shoulder tension.',
            logKey,
            exId: cur.id,
            resolvedLib: lib,
            syncMetric: resA.allowBenchmarkSync ? (cur.syncMetric || null) : null
          });
        } else {
          steps.push({
            title: lib.name,
            contrastTitle: null,
            rx,
            sets,
            isContrast: false,
            contrastRestSec: 0,
            fullRestSec,
            workSec,
            cueA: driveCue(cur.id, lib),
            cueB: null,
            logKey,
            exId: cur.id,
            resolvedLib: lib,
            syncMetric: resA.allowBenchmarkSync ? (cur.syncMetric || null) : null
          });
        }
      }
      const modeTag = state.gymMode === 'home' ? ' [HOME GYM]' : '';
      return { title: `DAY ${dObj.day}${modeTag} · ${dObj.title}`, steps };
    }

    // Free ($0) Audio & Haptic Engine (Web Audio API + Browser SpeechSynthesis + Vibrate)
    const MAT_AUDIO = {
      ctx() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          return audioCtx;
        } catch (_) { return null; }
      },
      tone(freq, dur = 0.08, vol = 0.22, delay = 0, type = 'sine') {
        const c = this.ctx();
        if (!c) return;
        const now = c.currentTime + delay;
        const osc = c.createOscillator(), g = c.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(vol, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g); g.connect(c.destination);
        osc.start(now); osc.stop(now + dur);
      },
      // Dojo hyoshigi wooden-clack synthesis ($0)
      clack(delay = 0) {
        const c = this.ctx();
        if (!c) return;
        const now = c.currentTime + delay;
        const osc = c.createOscillator(), g = c.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1280, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.045);
        g.gain.setValueAtTime(0.32, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
        osc.connect(g); g.connect(c.destination);
        osc.start(now); osc.stop(now + 0.06);
      },
      speak(text) {
        try {
          if (!('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.rate = 1.06; u.pitch = 1.0; u.volume = 1.0;
          window.speechSynthesis.speak(u);
        } catch (_) {}
      },
      flash(color = 'crimson', vib = [120, 60, 120]) {
        const ov = document.getElementById('matOverlay');
        if (ov) {
          ov.classList.remove('mat-flash-crimson', 'mat-flash-emerald', 'mat-flash-amber');
          void ov.offsetWidth;
          ov.classList.add(`mat-flash-${color}`);
        }
        try { if (navigator.vibrate) navigator.vibrate(vib); } catch (_) {}
      },
      cue(kind, speechText = '') {
        const m = state.matAudioMode || 'tones';
        const useTones = m === 'tones' || m === 'voice_tones';
        const useVoice = m === 'voice' || m === 'voice_tones';

        if (kind === 'tick') {
          if (useTones) this.tone(760, 0.05, 0.18);
          if (useVoice && speechText) this.speak(speechText);
          if (m === 'silent') this.flash('amber', [60]);
        } else if (kind === 'warn10') {
          if (useTones) { this.clack(0); this.clack(0.11); }
          if (useVoice) this.speak(speechText || '10 seconds');
          this.flash('amber', [90, 50, 90]);
        } else if (kind === 'contrast_go') {
          if (useTones) { this.clack(0); this.tone(920, 0.1, 0.25, 0.06); this.tone(1380, 0.14, 0.28, 0.18); }
          if (useVoice) this.speak(speechText || 'Go! Explosive contrast movement now!');
          this.flash('emerald', [140, 60, 180]);
        } else if (kind === 'full_go') {
          if (useTones) { this.tone(660, 0.08, 0.22, 0); this.tone(880, 0.08, 0.24, 0.1); this.tone(1320, 0.16, 0.28, 0.2); }
          if (useVoice) this.speak(speechText || 'Rest complete. Next set, go!');
          this.flash('emerald', [150, 60, 150, 60, 200]);
        } else if (kind === 'rest_start') {
          if (useTones) { this.clack(0); this.tone(440, 0.12, 0.18, 0.07); }
          if (useVoice && speechText) this.speak(speechText);
          if (m === 'silent') this.flash('crimson', [110]);
        } else if (kind === 'test') {
          if (m === 'silent') {
            this.flash('crimson', [140, 70, 140]);
            toast('Visual Flash + Vibrate triggered!');
          } else {
            if (useTones) { this.clack(0); this.tone(880, 0.09, 0.24, 0.08); this.tone(1320, 0.14, 0.26, 0.2); }
            if (useVoice) this.speak('Mat mode ready. Rest 60 seconds. Up next: Standing Broad Jump.');
          }
        }
      }
    };

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !MAT.wakeLock) {
          MAT.wakeLock = await navigator.wakeLock.request('screen');
          MAT.wakeLock.addEventListener('release', () => { MAT.wakeLock = null; updateMatWakeUI(); });
          updateMatWakeUI();
        }
      } catch (_) {}
    }
    function releaseWakeLock() {
      try { if (MAT.wakeLock) { MAT.wakeLock.release(); MAT.wakeLock = null; } } catch (_) {}
    }
    function updateMatWakeUI() {
      const el = document.getElementById('matWakeBadge');
      if (el) el.textContent = MAT.wakeLock ? '☀ Screen Awake' : 'Screen Auto';
    }

    function stopMatTick() {
      MAT.running = false;
      clearInterval(MAT.tickId);
      MAT.tickId = null;
    }

    function startMatTick() {
      stopMatTick();
      MAT.running = true;
      MAT.tickId = setInterval(() => {
        if (!MAT.running) return;
        MAT.remaining = Math.max(0, MAT.remaining - 1);
        if (MAT.remaining === 10 && (MAT.phase === 'CONTRAST_REST' || MAT.phase === 'FULL_REST')) {
          MAT_AUDIO.cue('warn10', '10 seconds');
        } else if (MAT.remaining >= 1 && MAT.remaining <= 3) {
          MAT_AUDIO.cue('tick', String(MAT.remaining));
        } else if (MAT.remaining === 0) {
          onMatTimerZero();
          return;
        }
        updateMatDigitsOnly();
      }, 1000);
      renderMatOverlay();
    }

    function onMatTimerZero() {
      stopMatTick();
      const step = MAT.steps[MAT.stepIdx];
      if (!step) return;

      if (MAT.phase === 'CONTRAST_REST') {
        MAT.phase = 'CONTRAST_WORK';
        MAT.remaining = 0;
        MAT_AUDIO.cue('contrast_go', `Go! ${step.contrastTitle || 'Contrast movement'} now!`);
      } else if (MAT.phase === 'FULL_REST') {
        if (MAT.curSet < step.sets) {
          MAT.curSet++;
          if (step.workSec > 0) {
            MAT.phase = 'WORK';
            MAT.remaining = step.workSec;
            MAT_AUDIO.cue('full_go', `Set ${MAT.curSet}. Go!`);
            startMatTick();
            return;
          } else {
            MAT.phase = 'WORK';
            MAT.remaining = 0;
            MAT_AUDIO.cue('full_go', `Rest complete. Set ${MAT.curSet} of ${step.sets}, go!`);
          }
        } else if (MAT.stepIdx < MAT.steps.length - 1) {
          MAT.stepIdx++;
          MAT.curSet = 1;
          const nxt = MAT.steps[MAT.stepIdx];
          MAT.phase = 'READY';
          MAT.remaining = nxt.workSec || 0;
          MAT_AUDIO.cue('full_go', `Rest complete. Up next: ${nxt.title}.`);
        } else {
          MAT.phase = 'COMPLETE';
          MAT.remaining = 0;
          MAT_AUDIO.cue('full_go', 'Session complete! Great work.');
        }
      } else if (MAT.phase === 'WORK' && step.workSec > 0) {
        // Timed interval finished -> start rest automatically
        beginFullRest(step);
        return;
      }
      renderMatOverlay();
    }

    function beginFullRest(step) {
      MAT.phase = 'FULL_REST';
      MAT.remaining = step.fullRestSec || 90;
      const isLastSet = MAT.curSet >= step.sets;
      const nxtName = isLastSet
        ? (MAT.steps[MAT.stepIdx + 1]?.title || 'Session finish')
        : step.title;
      MAT_AUDIO.cue('rest_start', `Rest ${MAT.remaining} seconds. Up next: ${nxtName}.`);
      startMatTick();
    }

    function handleMatPrimaryAction() {
      const step = MAT.steps[MAT.stepIdx];
      if (!step) return;

      if (MAT.phase === 'COMPLETE') {
        closeMatMode();
        return;
      }
      if (MAT.phase === 'CONTRAST_REST' || MAT.phase === 'FULL_REST') {
        if (MAT.running) { stopMatTick(); renderMatOverlay(); }
        else { startMatTick(); }
        return;
      }
      if (MAT.phase === 'READY') {
        if (step.workSec > 0) {
          MAT.phase = 'WORK';
          MAT.remaining = step.workSec;
          MAT_AUDIO.cue('contrast_go', `Set ${MAT.curSet}. Go!`);
          startMatTick();
          return;
        }
        // Rep-based: first tap starts set, or directly completes Set 1 into rest
        MAT.phase = 'WORK';
        renderMatOverlay();
        return;
      }
      if (MAT.phase === 'WORK') {
        if (step.workSec > 0 && MAT.running) { stopMatTick(); renderMatOverlay(); return; }
        if (step.workSec > 0 && !MAT.running && MAT.remaining > 0) { startMatTick(); return; }
        if (step.isContrast) {
          MAT.phase = 'CONTRAST_REST';
          MAT.remaining = step.contrastRestSec || 60;
          MAT_AUDIO.cue('rest_start', `Rest ${MAT.remaining} seconds. Up next: ${step.contrastTitle}.`);
          startMatTick();
        } else {
          beginFullRest(step);
        }
        return;
      }
      if (MAT.phase === 'CONTRAST_WORK') {
        beginFullRest(step);
      }
    }

    function loadMatSource(source) {
      stopMatTick();
      if (source.type === 'preset' && MAT_PRESETS[source.key]) {
        const p = MAT_PRESETS[source.key];
        MAT.sourceKey = `preset:${source.key}`;
        MAT.headerTitle = p.title;
        MAT.steps = p.steps.map(s => ({ ...s }));
      } else {
        const dNum = source.day || state.selDay || 1;
        const built = buildMatStepsFromDay(dNum);
        MAT.sourceKey = `day:${dNum}`;
        MAT.headerTitle = built.title;
        MAT.steps = built.steps;
      }
      MAT.stepIdx = 0;
      MAT.curSet = 1;
      MAT.phase = 'READY';
      MAT.remaining = MAT.steps[0]?.workSec || 0;
      renderMatOverlay();
    }

    function openMatMode(source) {
      MAT.open = true;
      loadMatSource(source || { type: 'day', day: state.selDay || 1 });
      const ov = document.getElementById('matOverlay');
      ov.classList.remove('hidden');
      ov.classList.add('flex');
      document.body.style.overflow = 'hidden';
      requestWakeLock();
    }

    function closeMatMode() {
      stopMatTick();
      MAT.open = false;
      try { window.speechSynthesis?.cancel(); } catch (_) {}
      releaseWakeLock();
      const ov = document.getElementById('matOverlay');
      ov.classList.add('hidden');
      ov.classList.remove('flex');
      document.body.style.overflow = '';
      if (state.activeTab === 'plan28') renderPlan28();
    }

    function fmtMMSS(sec) {
      const s = Math.max(0, Math.round(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    function updateMatDigitsOnly() {
      const d = document.getElementById('matDigits');
      if (d) d.textContent = fmtMMSS(MAT.remaining);
    }

    function renderMatOverlay() {
      const ov = document.getElementById('matOverlay');
      if (!ov || !MAT.open) return;
      const step = MAT.steps[MAT.stepIdx] || MAT.steps[0];
      if (!step) return;

      const phaseMap = {
        READY:         { lbl: 'READY',         cls: 'bg-white/10 text-slate-200 border-hairline' },
        WORK:          { lbl: 'WORK SET',      cls: 'bg-crimson/20 text-crimson border-crimson/50' },
        CONTRAST_REST: { lbl: 'CONTRAST REST', cls: 'bg-amberK/20 text-amberK border-amberK/50' },
        CONTRAST_WORK: { lbl: 'CONTRAST GO!',  cls: 'bg-emeraldK/20 text-emeraldK border-emeraldK/50' },
        FULL_REST:     { lbl: 'FULL REST',     cls: 'bg-skyK/20 text-skyK border-skyK/50' },
        COMPLETE:      { lbl: 'COMPLETE',      cls: 'bg-emeraldK text-[#0d0f12] border-emeraldK' }
      };
      const ph = phaseMap[MAT.phase] || phaseMap.READY;

      const activeMoveTitle = MAT.phase === 'CONTRAST_WORK' && step.contrastTitle ? step.contrastTitle : step.title;
      const cueHeading = MAT.phase === 'CONTRAST_REST'
        ? `UP NEXT (CONTRAST): ${step.contrastTitle}`
        : (MAT.phase === 'FULL_REST'
          ? (MAT.curSet < step.sets ? `UP NEXT: SET ${MAT.curSet + 1} · ${step.title}` : `UP NEXT: ${MAT.steps[MAT.stepIdx + 1]?.title || 'Cooldown / Finish'}`)
          : 'EXECUTION DRIVE CUE');
      const cueBody = (MAT.phase === 'CONTRAST_REST' || MAT.phase === 'CONTRAST_WORK') && step.cueB
        ? step.cueB
        : (MAT.phase === 'FULL_REST' && MAT.curSet >= step.sets && MAT.steps[MAT.stepIdx + 1]
          ? MAT.steps[MAT.stepIdx + 1].cueA
          : step.cueA);

      let primaryLbl = 'START SET';
      let primaryCls = 'bg-crimson text-white';
      if (MAT.phase === 'READY') primaryLbl = step.workSec > 0 ? `▶ START ${step.workSec}s ROUND` : '▶ START SET / LOG';
      else if (MAT.phase === 'WORK') {
        if (step.workSec > 0) primaryLbl = MAT.running ? '❚❚ PAUSE WORK' : '▶ RESUME WORK';
        else primaryLbl = step.isContrast ? `✓ COMPLETE LIFT → ${step.contrastRestSec}s CONTRAST REST` : `✓ COMPLETE SET → ${step.fullRestSec}s REST`;
      } else if (MAT.phase === 'CONTRAST_WORK') {
        primaryLbl = `✓ COMPLETE CONTRAST → ${step.fullRestSec}s FULL REST`;
        primaryCls = 'bg-emeraldK text-[#0d0f12]';
      } else if (MAT.phase === 'CONTRAST_REST' || MAT.phase === 'FULL_REST') {
        primaryLbl = MAT.running ? '❚❚ PAUSE REST TIMER' : '▶ RESUME REST TIMER';
        primaryCls = 'bg-amberK text-[#0d0f12]';
      } else if (MAT.phase === 'COMPLETE') {
        primaryLbl = '✓ FINISH & EXIT MAT MODE';
        primaryCls = 'bg-emeraldK text-[#0d0f12]';
      }

      // Optional inline number log for current day exercise
      const lib = step.resolvedLib || (step.exId ? EXERCISE_LIBRARY[step.exId] : null);
      const saved = step.logKey ? (state.exLogs[step.logKey] || {}) : null;
      const kind = lib ? logKindOf(lib.logType) : 'score10';
      const showLog = !!(step.logKey && lib);

      ov.innerHTML = `
        <div class="max-w-3xl w-full mx-auto flex-1 flex flex-col justify-between p-4 sm:p-6 gap-4">
          <!-- Top Bar -->
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-hairline">
            <div class="flex items-center gap-2 min-w-0">
              <button id="matCloseBtn" type="button" class="px-3 py-2 rounded-xl font-mono text-xs font-bold border border-hairline bg-card hover:border-crimson text-slate-200 min-h-[42px]">✕ Exit</button>
              <div class="min-w-0">
                <div class="font-mono text-[10px] uppercase tracking-wider text-crimson font-bold">HANDS-FREE MAT MODE</div>
                <div class="font-semibold text-xs sm:text-sm text-slate-100 truncate">${esc(MAT.headerTitle)}</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span id="matWakeBadge" class="hidden sm:inline px-2.5 py-1 rounded-lg font-mono text-[10px] border border-hairline bg-card text-emeraldK">${MAT.wakeLock ? '☀ Screen Awake' : 'Screen Auto'}</span>
              <select id="matSourceSel" class="min-h-[40px] px-2.5 rounded-xl font-mono text-[11px] bg-card border border-hairline text-slate-100">
                <option value="day:${state.selDay}" ${MAT.sourceKey === `day:${state.selDay}` ? 'selected' : ''}>Day ${state.selDay} Workout</option>
                <option value="preset:contrast" ${MAT.sourceKey === 'preset:contrast' ? 'selected' : ''}>Preset: Contrast 60s/180s</option>
                <option value="preset:alactic" ${MAT.sourceKey === 'preset:alactic' ? 'selected' : ''}>Preset: Alactic Speed 90s</option>
                <option value="preset:kata" ${MAT.sourceKey === 'preset:kata' ? 'selected' : ''}>Preset: Kata Cluster 90s</option>
                <option value="preset:kumite" ${MAT.sourceKey === 'preset:kumite' ? 'selected' : ''}>Preset: Kumite 20s/90s</option>
              </select>
            </div>
          </div>

          <!-- Free ($0) Audio & Callout Mode Strip -->
          <div class="rounded-xl panel-card p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
            <div class="flex items-center gap-2 flex-1 min-w-0">
              <span class="font-mono text-[10px] uppercase font-bold text-emeraldK shrink-0">Audio ($0):</span>
              <select id="matAudioSel" class="flex-1 min-h-[40px] px-2.5 rounded-lg font-mono text-xs bg-[#0d0f12] border border-hairline text-slate-100">
                <option value="tones" ${state.matAudioMode === 'tones' ? 'selected' : ''}>Tone Calls (Web Audio — $0)</option>
                <option value="voice_tones" ${state.matAudioMode === 'voice_tones' ? 'selected' : ''}>Free Voice + Tones (Browser TTS — $0)</option>
                <option value="voice" ${state.matAudioMode === 'voice' ? 'selected' : ''}>Free Voice Only (Browser TTS — $0)</option>
                <option value="silent" ${state.matAudioMode === 'silent' ? 'selected' : ''}>Visual Flash + Vibrate (Silent — $0)</option>
              </select>
            </div>
            <button id="matTestAudio" type="button" class="px-3.5 py-2 rounded-lg font-mono text-xs font-bold border border-hairline bg-cardSub hover:border-amberK text-amberK min-h-[40px] shrink-0">
              🔊 Test Audio
            </button>
          </div>

          <!-- Center Stage: Phase, Move, Giant Timer & Upcoming Cue -->
          <div class="flex-1 flex flex-col items-center justify-center text-center py-2 space-y-4">
            <div class="flex flex-wrap items-center justify-center gap-2">
              <span class="px-3.5 py-1 rounded-full font-mono text-xs font-extrabold border ${ph.cls}">${ph.lbl}</span>
              <span class="px-3 py-1 rounded-full font-mono text-xs font-bold bg-card border border-hairline text-slate-200">SET ${MAT.curSet} / ${step.sets}</span>
              <span class="px-3 py-1 rounded-full font-mono text-xs bg-card border border-hairline text-slate-400">MOVE ${MAT.stepIdx + 1} / ${MAT.steps.length}</span>
            </div>

            <div class="space-y-1 max-w-xl">
              <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">${esc(activeMoveTitle)}</h2>
              <p class="font-mono text-xs sm:text-sm text-slate-400">${esc(step.rx)}</p>
            </div>

            <div id="matDigits" class="font-mono tabular-nums text-7xl sm:text-8xl font-extrabold tracking-tight ${MAT.phase === 'CONTRAST_REST' ? 'text-amberK' : (MAT.phase === 'FULL_REST' ? 'text-skyK' : (MAT.phase === 'CONTRAST_WORK' || MAT.phase === 'COMPLETE' ? 'text-emeraldK' : 'text-white'))}">
              ${fmtMMSS(MAT.remaining)}
            </div>

            <!-- Upcoming / Active Drive Cue Preview -->
            <div class="w-full max-w-xl rounded-2xl panel-sub p-4 text-left space-y-1 border-l-4 ${MAT.phase === 'CONTRAST_REST' ? 'border-l-amberK' : 'border-l-crimson'}">
              <div class="font-mono text-[10px] uppercase tracking-wider font-bold ${MAT.phase === 'CONTRAST_REST' ? 'text-amberK' : 'text-crimson'}">${esc(cueHeading)}</div>
              <p class="text-xs sm:text-sm text-slate-100 leading-relaxed">${esc(cueBody)}</p>
            </div>

            <!-- Quick Inline Log Inside Mat Mode -->
            ${showLog ? `
              <div class="w-full max-w-xl rounded-xl panel-card p-3 flex flex-wrap items-center justify-between gap-2.5">
                <span class="font-mono text-[11px] text-slate-400 uppercase">Quick Log (${esc(lib.name.slice(0, 22))}):</span>
                <div class="flex items-center gap-2">
                  <input id="matLogV1" type="number" inputmode="decimal" step="any" placeholder="${lib.logType === 'weight_reps' ? `Load (${uLbl('mass')})` : uLbl(kind)}"
                    value="${esc(fDisp(kind, saved?.v1 ?? ''))}"
                    class="w-28 min-h-[42px] px-2.5 rounded-lg font-mono text-sm font-bold bg-[#0d0f12] border border-hairline text-slate-100 text-center" />
                  ${lib.logType === 'weight_reps' ? `
                    <input id="matLogV2" type="number" inputmode="numeric" step="1" placeholder="Reps"
                      value="${esc(saved?.v2 ?? '')}"
                      class="w-20 min-h-[42px] px-2.5 rounded-lg font-mono text-sm font-bold bg-[#0d0f12] border border-hairline text-slate-100 text-center" />` : ''}
                </div>
              </div>` : ''}
          </div>

          <!-- Sweat-Friendly Bottom Controls -->
          <div class="space-y-2.5 pt-2">
            <button id="matPrimaryBtn" type="button" class="w-full min-h-[60px] rounded-2xl font-mono text-sm sm:text-base font-extrabold shadow-xl transition-transform active:scale-[0.99] ${primaryCls}">
              ${primaryLbl}
            </button>

            <div class="grid grid-cols-4 gap-2">
              <button id="matAdd15" type="button" class="min-h-[50px] rounded-xl font-mono text-xs sm:text-sm font-bold bg-card border border-hairline hover:border-amberK text-amberK">+15s</button>
              <button id="matSkipRest" type="button" class="min-h-[50px] rounded-xl font-mono text-xs sm:text-sm font-bold bg-card border border-hairline hover:border-emeraldK text-emeraldK">Skip Rest</button>
              <button id="matPrevEx" type="button" ${MAT.stepIdx <= 0 ? 'disabled' : ''} class="min-h-[50px] rounded-xl font-mono text-xs sm:text-sm font-bold bg-card border border-hairline text-slate-200 disabled:opacity-30">&larr; Prev</button>
              <button id="matNextEx" type="button" ${MAT.stepIdx >= MAT.steps.length - 1 ? 'disabled' : ''} class="min-h-[50px] rounded-xl font-mono text-xs sm:text-sm font-bold bg-card border border-hairline text-slate-200 disabled:opacity-30">Next &rarr;</button>
            </div>
          </div>
        </div>`;

      // Bind Mat Mode controls
      document.getElementById('matCloseBtn')?.addEventListener('click', closeMatMode);
      document.getElementById('matSourceSel')?.addEventListener('change', e => {
        const [type, val] = e.target.value.split(':');
        loadMatSource(type === 'preset' ? { type: 'preset', key: val } : { type: 'day', day: Number(val) });
      });
      document.getElementById('matAudioSel')?.addEventListener('change', e => {
        state.matAudioMode = e.target.value;
        saveState();
        toast(`Mat Mode audio set: ${e.target.options[e.target.selectedIndex].text}`);
      });
      document.getElementById('matTestAudio')?.addEventListener('click', () => MAT_AUDIO.cue('test'));
      document.getElementById('matPrimaryBtn')?.addEventListener('click', handleMatPrimaryAction);

      document.getElementById('matAdd15')?.addEventListener('click', () => {
        MAT.remaining += 15;
        updateMatDigitsOnly();
        toast('+15 seconds added');
      });
      document.getElementById('matSkipRest')?.addEventListener('click', () => {
        if (MAT.phase === 'CONTRAST_REST' || MAT.phase === 'FULL_REST') {
          MAT.remaining = 0;
          onMatTimerZero();
        } else {
          toast('Not currently in a rest phase.');
        }
      });
      document.getElementById('matPrevEx')?.addEventListener('click', () => {
        if (MAT.stepIdx > 0) {
          stopMatTick(); MAT.stepIdx--; MAT.curSet = 1; MAT.phase = 'READY';
          MAT.remaining = MAT.steps[MAT.stepIdx]?.workSec || 0;
          renderMatOverlay();
        }
      });
      document.getElementById('matNextEx')?.addEventListener('click', () => {
        if (MAT.stepIdx < MAT.steps.length - 1) {
          stopMatTick(); MAT.stepIdx++; MAT.curSet = 1; MAT.phase = 'READY';
          MAT.remaining = MAT.steps[MAT.stepIdx]?.workSec || 0;
          renderMatOverlay();
        }
      });

      if (showLog) {
        document.getElementById('matLogV1')?.addEventListener('change', e => {
          if (!state.exLogs[step.logKey]) state.exLogs[step.logKey] = {};
          const canon = fCanon(kind, e.target.value);
          state.exLogs[step.logKey].v1 = canon;
          if (step.syncMetric && state.bm[step.syncMetric[0]]) {
            state.bm[step.syncMetric[0]][step.syncMetric[1]] = canon;
          }
          saveState();
          toast('Logged & synced!');
        });
        document.getElementById('matLogV2')?.addEventListener('change', e => {
          if (!state.exLogs[step.logKey]) state.exLogs[step.logKey] = {};
          state.exLogs[step.logKey].v2 = e.target.value === '' ? '' : parseInt(e.target.value, 10);
          saveState();
        });
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && MAT.open) requestWakeLock();
    });

    /* ======================================================================
       13. GLOBAL CONTROLS & BOOTSTRAP
       ====================================================================== */
    function toggleUnits() {
      state.unit = state.unit === 'imperial' ? 'metric' : 'imperial';
      syncUnitUI(); saveState(); renderCurrentTab();
      toast(`Switched to ${state.unit === 'imperial' ? 'Imperial (lbs / in)' : 'Metric (kg / cm)'}`);
    }

    function setGymMode(mode) {
      state.gymMode = mode === 'home' ? 'home' : 'gym';
      syncGymModeUI(); saveState(); renderCurrentTab();
      if (MAT.open && MAT.sourceKey.startsWith('day:')) {
        loadMatSource({ type: 'day', day: Number(MAT.sourceKey.split(':')[1]) });
      }
      toast(state.gymMode === 'home'
        ? '🏠 Home Gym Mode ON — workouts tailored to your home setup!'
        : '🏢 Commercial Gym Mode ON');
    }

    document.getElementById('unitBtn')?.addEventListener('click', toggleUnits);
    document.getElementById('gymModeBtn')?.addEventListener('click', () => setGymMode(state.gymMode === 'home' ? 'gym' : 'home'));
    document.getElementById('hdrMatBtn')?.addEventListener('click', () => openMatMode({ type: 'day', day: state.selDay || 1 }));
    document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => goTab(b.dataset.tab)));
    document.getElementById('modalNo')?.addEventListener('click', closeModal);
    document.getElementById('modalYes')?.addEventListener('click', () => { const fn = modalAction; closeModal(); if (fn) fn(); });

    window.addEventListener('load', () => {
      syncUnitUI();
      syncGymModeUI();
      // Pass persist = false on startup so initial render NEVER stamps updatedAt or overwrites cloud data
      goTab(state.activeTab || 'overview', false);
      initCloud();
    });
  </script>
</body>
</html>
