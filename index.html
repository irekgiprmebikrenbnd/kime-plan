  <style>
    :root { color-scheme: dark; }
    html, body {
      background-color: #0d0f12;

      overflow-x: hidden;

      -webkit-tap-highlight-color: transparent;

    .panel-card { background: #131722; border: 1px solid #23293a; }
    .panel-sub { background: #191f2e; border: 1px solid #272f42; }
    [class*="bg-[#0b0d12]"] { background-color: #0d0f12; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Touch-friendly custom checkbox */
    .k-check {
      appearance: none; -webkit-appearance: none;
      width: 1.4rem; height: 1.4rem; border-radius: 0.42rem;
      border: 1.5px solid #3c465e; background: #0d0f12;
      display: inline-grid; place-content: center; cursor: pointer; flex-shrink: 0;
      transition: all 0.14s ease;
    }
    .k-check:checked { background: #10b981; border-color: #10b981; }
    .k-check:checked::before {
      content: ""; width: 0.68rem; height: 0.68rem;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      background: #0d0f12;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: #e11d48 !important;
      box-shadow: 0 0 0 2px rgba(225, 29, 72, 0.25);
    }

    /* Smooth accordion drawer */
    .acc-body {
      display: grid; grid-template-rows: 0fr; opacity: 0;
      transition: grid-template-rows 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease;
    }
    .acc-body.open { grid-template-rows: 1fr; opacity: 1; }
    .acc-inner { overflow: hidden; }
    .chev { transition: transform 0.2s ease; }
    .is-open .chev { transform: rotate(180deg); }

    .safe-pb { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .tab-fade { animation: fadeUp 0.16s ease-out; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .react-pad { user-select: none; -webkit-user-select: none; transition: transform 0.05s ease, background-color 0.06s linear; }
    .react-pad:active { transform: scale(0.99); }

    /* Mat Mode silent visual border flash */
    @keyframes matPulseCrimson {
      0%, 100% { box-shadow: inset 0 0 0 0 rgba(225, 29, 72, 0); }
      35% { box-shadow: inset 0 0 0 12px rgba(225, 29, 72, 0.92); }
    }
    @keyframes matPulseEmerald {
      0%, 100% { box-shadow: inset 0 0 0 0 rgba(16, 185, 129, 0); }
      35% { box-shadow: inset 0 0 0 12px rgba(16, 185, 129, 0.95); }
    }
    @keyframes matPulseAmber {
      0%, 100% { box-shadow: inset 0 0 0 0 rgba(245, 158, 11, 0); }
      35% { box-shadow: inset 0 0 0 12px rgba(245, 158, 11, 0.92); }
    }
    .mat-flash-crimson { animation: matPulseCrimson 0.85s ease-out; }
    .mat-flash-emerald { animation: matPulseEmerald 0.85s ease-out; }
    .mat-flash-amber { animation: matPulseAmber 0.85s ease-out; }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* Dual Circular Cadence Telemetry Rings */
    .cad-dial {
      background: radial-gradient(circle at 50% 35%, rgba(30, 37, 54, 0.55), rgba(13, 15, 18, 0.95) 75%);
    }
    .cad-ring-glow-crimson { filter: drop-shadow(0 0 8px rgba(225, 29, 72, 0.45)); }
    .cad-ring-glow-amber { filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.45)); }
    .cad-ring-glow-sky { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45)); }
    .cad-ring-glow-emerald { filter: drop-shadow(0 0 9px rgba(16, 185, 129, 0.5)); }
    @keyframes cadBeatPop {
      0% { transform: scale(1); }
      30% { transform: scale(1.045); }
      100% { transform: scale(1); }
    }
    .cad-beat-pop { animation: cadBeatPop 0.24s cubic-bezier(0.22, 1, 0.36, 1); }

     * Resolves an exercise item for either Commercial Gym ('gym') or Home Gym ('home') mode.
     * Handles special day-level deload speed swaps (e.g., Day 22 Trap Bar -> 40 lb KB Power Swings).
     */
    function resolveExercise(item, dayObj = null) {
      const baseLib = EXERCISE_LIBRARY[item.id];
      if (!baseLib) return null;
      if (state.gymMode !== 'home') {
        return { lib: baseLib, rx: item.rx, isSwapped: false, originalName: null, allowBenchmarkSync: true };
      }
      // Day 22 Deload Speed-Strength: use 40 lb KB Power Swings for maximal hip velocity
      if (item.id === 'trap_bar' && dayObj?.day === 22) {
        const kb = HOME_SWAPS.medball_slam;
        return {
          lib: kb,
          rx: '3 x 5 explosive 40 lb KB Hardstyle Power Swings (100% hip snap) · 2.5m rest',
          isSwapped: true,
          originalName: baseLib.name,
          allowBenchmarkSync: false
        };
      }
      const swap = HOME_SWAPS[item.id];
      if (!swap) {
        return { lib: baseLib, rx: item.rx, isSwapped: false, originalName: null, allowBenchmarkSync: true };
      }
      const rx = typeof swap.rxFor === 'function' ? swap.rxFor(dayObj, item.rx) : (swap.rx || item.rx);
      return {
        lib: swap,
        rx,
        isSwapped: true,
        originalName: baseLib.name,
        allowBenchmarkSync: swap.preserveBenchmark !== false
      };
    }

      BENCHMARKS.forEach(m => bm[m.id] = { base: '', mid: '', retest: '' });
      bm.bodyweight.base = DEFAULT_BW_KG; // 142 lbs / 64.4 kg
      return {
        unit: 'imperial',
        gymMode: 'gym', // 'gym' | 'home'
        activeTab: 'overview',
        startDate: '2026-12-07',
        selWeek: 1,
        selDay: 1,
        bwKg: DEFAULT_BW_KG,
        matAudioMode: 'tones', // 'tones' | 'voice_tones' | 'voice' | 'silent'
        preChecks: {},
        preNotes: '',
        exChecks: {},
        exLogs: {},   // "d{day}_i{idx}" -> { v1, v2 }
        dayDone: {},
        checkIns: {}, // day -> { bwKg, sleep, cns, dojo, prot, carb, note }
        bm,
        cadenceMaps: defaultCadenceMaps(),
        activeCadenceMapId: 'ck_sandra_ref',
        labBest: { c1: null, c3: null, c4: null, fsRate: null },
        updatedAt: 0
      };
    }

    function hydrate(raw) {
      const d = defaultState();
      if (!raw || typeof raw !== 'object') return d;
      const s = { ...d, ...raw };
      s.bm = { ...d.bm, ...(raw.bm || {}) };
      BENCHMARKS.forEach(m => { if (!s.bm[m.id]) s.bm[m.id] = { base: '', mid: '', retest: '' }; });
      if (!s.bwKg || isNaN(+s.bwKg)) s.bwKg = DEFAULT_BW_KG;
      if (s.bm.bodyweight.base === '') s.bm.bodyweight.base = s.bwKg;
      if (!['tones', 'voice_tones', 'voice', 'silent'].includes(s.matAudioMode)) s.matAudioMode = 'tones';
      if (!['gym', 'home'].includes(s.gymMode)) s.gymMode = 'gym';
      if (!Array.isArray(s.cadenceMaps) || !s.cadenceMaps.length) s.cadenceMaps = defaultCadenceMaps();
      if (!s.cadenceMaps.some(m => m.id === s.activeCadenceMapId)) s.activeCadenceMapId = s.cadenceMaps[0].id;

      // Automatic one-time migration: move existing Phrase 1 sequence -> standalone Full Kata track
      let migrated = false;
      s.cadenceMaps.forEach(m => {
        if (!m.fullKata || typeof m.fullKata !== 'object') {
          m.fullKata = { beats: [], cleanPct: 0, videoStartSec: null };
        }
        if (!Array.isArray(m.fullKata.beats)) m.fullKata.beats = [];
        if (typeof m.fullKata.cleanPct !== 'number') m.fullKata.cleanPct = 0;
        if (!Array.isArray(m.phrases)) m.phrases = [];

        if (!m.fullKataMigrated) {
          const p0 = m.phrases[0];
          if (p0 && Array.isArray(p0.beats) && p0.beats.length > 0 && m.fullKata.beats.length === 0) {
            m.fullKata.beats = p0.beats.map(b => ({ t: Math.max(0, Math.round(b.t || 0)), type: b.type || 'beat' }));
            m.fullKata.cleanPct = Number(p0.cleanPct) || 0;
            m.fullKata.videoStartSec = p0.videoStartSec ?? null;
            p0.beats = [];
            p0.cleanPct = 0;
            p0.videoStartSec = null;
            migrated = true;
          }
          m.fullKataMigrated = true;
        }
      });
      if (migrated) s._needsMigrationSave = true;
      return s;
    }

    /**
     * Checks whether a state object contains real athlete-entered data so a fresh blank
     * default state can NEVER overwrite saved beats, benchmarks, or workout logs in the cloud.
     */
    function hasUserData(s) {
      if (!s || typeof s !== 'object') return false;
      if (s.cadenceMaps?.some(m => (m.fullKata?.beats?.length || 0) > 0 || (m.fullKata?.cleanPct || 0) > 0 || m.phrases?.some(p => (p.beats?.length || 0) > 0 || (p.cleanPct || 0) > 0))) return true;
      if (Object.values(s.preChecks || {}).some(Boolean) || (s.preNotes && s.preNotes.trim().length > 0)) return true;
      if (Object.values(s.exChecks || {}).some(Boolean) || Object.values(s.dayDone || {}).some(Boolean)) return true;
      if (Object.keys(s.exLogs || {}).length > 0 || Object.keys(s.checkIns || {}).length > 0) return true;
      if (s.bm && Object.entries(s.bm).some(([k, row]) => {
        if (!row) return false;
        if (k === 'bodyweight') return row.mid !== '' || row.retest !== '' || (row.base !== '' && Math.abs(+row.base - DEFAULT_BW_KG) > 0.05);
        return row.base !== '' || row.mid !== '' || row.retest !== '';
      })) return true;
      return false;
    }

    let state = defaultState();
    const expandedSet = new Set();

    // Load local mirror immediately if available (offline / standalone PWA)
    try {
      const cached = window.localStorage.getItem(LOCAL_KEY);
      if (cached) {
        state = hydrate(JSON.parse(cached));
        if (state._needsMigrationSave) {
          delete state._needsMigrationSave;
          state.updatedAt = Date.now();
          window.localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
        }
      }
    } catch (_) {}

    // Two-way map between benchmarks & day exercise logs
    const BM_LINKS = {};
    DAYS_DATA.forEach(d => d.exercises.forEach((ex, i) => {
      if (ex.syncMetric) {
        const key = `${ex.syncMetric[0]}:${ex.syncMetric[1]}`;
        if (!BM_LINKS[key]) BM_LINKS[key] = [];
        BM_LINKS[key].push(`d${d.day}_i${i}`);
      }
    }));

    let db = null, currentUser = null, saveTimer = null, localWritePending = false;
    let cloudConfigured = false, cloudHydrated = false, pendingCloudPush = false;
    const clientTag = 'c_' + Math.random().toString(36).slice(2, 9);

    function setSyncUI(mode) {
      const dot = document.getElementById('syncDot');
      const txt = document.getElementById('syncText');
      if (!dot || !txt) return;
      if (mode === 'cloud') {
        dot.className = 'w-2 h-2 rounded-full bg-emeraldK shrink-0';
        txt.className = 'text-emeraldK font-semibold whitespace-nowrap';
        txt.textContent = 'Cloud Synced';
      } else if (mode === 'saving') {
        dot.className = 'w-2 h-2 rounded-full bg-amberK animate-pulse shrink-0';
        txt.className = 'text-amberK font-semibold whitespace-nowrap';
        txt.textContent = 'Saving...';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-skyK shrink-0';
        txt.className = 'text-skyK font-semibold whitespace-nowrap';
        txt.textContent = 'Saved Locally';
      }
    }

    function saveState() {
      state.updatedAt = Date.now();
      // Mirror to localStorage immediately for instant offline durability
      try { window.localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (_) {}

      // Wait for initial cloud snapshot before writing so we never race-overwrite existing cloud data
      if (cloudConfigured && !cloudHydrated) {
        pendingCloudPush = true;
        setSyncUI('saving');
        return;
      }
      if (!db || !currentUser) { setSyncUI('local'); return; }

      localWritePending = true;
      setSyncUI('saving');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        if (!db || !currentUser) return;
        try {
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
          const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'kime_hub', 'state');
          await setDoc(ref, { payload: JSON.stringify(state), updatedAt: state.updatedAt, clientTag });
          localWritePending = false;
          pendingCloudPush = false;
          setSyncUI('cloud');
        } catch (err) {
          console.error('Cloud save error:', err);
          setSyncUI('local');
        }
      }, 320);
    }

    async function initCloud() {
      try {
        if (typeof __firebase_config === 'undefined' || !__firebase_config) {
          cloudConfigured = false;
          cloudHydrated = true;
          setSyncUI('local');
          return;
        }
        cloudConfigured = true;
        const cfg = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
        const app = initializeApp(cfg);
        const auth = getAuth(app);
        db = getFirestore(app);

        // RULE 3: Authenticate FIRST and await
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        currentUser = auth.currentUser;
        if (!currentUser) { cloudHydrated = true; setSyncUI('local'); return; }

        // RULE 1: Strict private user path
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const ref = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'kime_hub', 'state');

        onSnapshot(
          ref,
          (snap) => {
            const firstSync = !cloudHydrated;
            cloudHydrated = true;

            if (snap.exists()) {
              const data = snap.data();
              if (data && data.clientTag === clientTag && localWritePending) return;
              if (data && data.payload) {
                try {
                  const remote = hydrate(JSON.parse(data.payload));
                  const remoteMigrated = !!remote._needsMigrationSave;
                  delete remote._needsMigrationSave;

                  const localHas = hasUserData(state);
                  const remoteHas = hasUserData(remote);

                  // Safety guard: NEVER let an empty local state overwrite real cloud data
                  const shouldAdoptRemote =
                    (!localHas && remoteHas) ||
                    (remoteHas && (remote.updatedAt || 0) >= (state.updatedAt || 0)) ||
                    (!localHas && !remoteHas && (remote.updatedAt || 0) >= (state.updatedAt || 0));

                  if (shouldAdoptRemote) {
                    state = remote;
                    pendingCloudPush = false;
                    try { window.localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (_) {}
                    if (remoteMigrated) saveState();
                    syncUnitUI();
                    syncGymModeUI();
                    goTab(state.activeTab || 'overview', false);
                  } else if (pendingCloudPush || (localHas && !remoteHas) || (localHas && (state.updatedAt || 0) > (remote.updatedAt || 0))) {
                    saveState();
                  }
                  setSyncUI('cloud');
                } catch (e) { console.error(e); }
              }
            } else {
              // Cloud doc does not exist yet: only write if user has real data or an unsaved local edit
              if (hasUserData(state) || pendingCloudPush) saveState();
              else setSyncUI('cloud');
            }
          },
          (err) => { console.error('Snapshot error:', err); cloudHydrated = true; setSyncUI('local'); }
        );
      } catch (e) {
        console.error('Firebase init fallback:', e);
        cloudHydrated = true;
        setSyncUI('local');
      }
    }

    /* ======================================================================
       6. DOMAIN CALCULATIONS, EQUIPMENT AUTO-DERIVATION & UI HELPERS
       ====================================================================== */
    function activeBwKg() {
      const b = state.bm.bodyweight;
      const v = b.retest !== '' ? b.retest : (b.mid !== '' ? b.mid : (b.base !== '' ? b.base : state.bwKg));
      const n = parseFloat(v);
      return (!isNaN(n) && n > 20) ? n : DEFAULT_BW_KG;
    }

    function getFueling(isDouble) {
      const kg = activeBwKg();
      return {
        kg, lbs: +(kg * LB_KG).toFixed(1),
        prot: `${Math.round(kg * 1.6)}–${Math.round(kg * 2.0)}g`,
        carbs: `${Math.round(kg * (isDouble ? 5 : 4))}–${Math.round(kg * (isDouble ? 7 : 5))}g`,
        water: `${(kg * 0.045 + (isDouble ? 1.0 : 0.5)).toFixed(1)}L`
      };
    }

    function uLbl(kind) {
      if (kind === 'mass') return state.unit === 'imperial' ? 'lbs' : 'kg';
      if (kind === 'length') return state.unit === 'imperial' ? 'in' : 'cm';
      if (kind === 'sec') return 's';
      if (kind === 'frames') return 'fr';
      if (kind === 'ms') return 'ms';
      if (kind === 'score10') return '/10';
      if (kind === 'pct') return '%';
      return '';
    }

    function fDisp(kind, val) {
      if (val === '' || val == null || isNaN(+val)) return '';
      if (kind === 'mass') return mDisp(val, state.unit);
      if (kind === 'length') return lDisp(val, state.unit);
      if (kind === 'sec') return (+val).toFixed(2);
      return trim0((+val).toFixed(1));
    }

    function fCanon(kind, raw) {
      if (raw === '' || raw == null) return '';
      if (kind === 'mass') return mCanon(raw, state.unit);
      if (kind === 'length') return lCanon(raw, state.unit);
      const n = parseFloat(raw);
      return isNaN(n) ? '' : n;
    }

    function logKindOf(logType) {
      if (logType === 'weight_reps') return 'mass';
      if (logType === 'distance') return 'length';
      if (logType === 'time') return 'sec';
      if (logType === 'frames') return 'frames';
      if (logType === 'latency') return 'ms';
      return 'score10';
    }

    function deriveDayEquipment(dayObj) {
      const real = new Set();
      dayObj.exercises.forEach(item => {
        const res = resolveExercise(item, dayObj);
        if (!res || !res.lib) return;
        const eq = res.lib.equipment || '';
        if (!eq.toLowerCase().startsWith('none')) real.add(eq);
      });
      if (dayObj.primer === 'A') {
        real.add(state.gymMode === 'home' ? 'Treadmill or Floor (Primer A)' : 'Jump Rope (Primer A)');
      }
      return real.size ? [...real] : ['None (Open Floor / Tatami)'];
    }

    function derivePrimerEquipment(pObj) {
      const real = new Set();
      if (pObj.id === 'A') real.add(state.gymMode === 'home' ? 'Treadmill (Optional) or Floor' : 'Jump Rope');
      pObj.items.forEach(it => {
        const res = resolveExercise(it);
        const eq = res?.lib?.equipment || '';
        if (!eq.toLowerCase().startsWith('none')) real.add(eq);
      });
      return real.size ? [...real] : ['None (Open Floor / Tatami)'];
    }

    function dayDateStr(dayNum) {
      if (!state.startDate) return '';
      const p = state.startDate.split('-').map(Number);
      if (p.length !== 3) return '';
      const d = new Date(p[0], p[1] - 1, p[2] + (dayNum - 1));
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function daysUntilStart() {
      if (!state.startDate) return 0;
      const p = state.startDate.split('-').map(Number);
      const target = new Date(p[0], p[1] - 1, p[2]);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((target - today) / 86400000);
    }

    function calcDelta(m, bVal, lVal) {
      const b = parseFloat(bVal), l = parseFloat(lVal);
      if (isNaN(b) || isNaN(l) || b === 0) return null;
      const diff = l - b;
      const pct = (diff / Math.abs(b)) * 100;
      let good = null;
      if (m.up === true) good = diff > 0;
      if (m.up === false) good = diff < 0;
      if (Math.abs(diff) < 1e-6) good = null;
      return { diff, pct, good };
    }

    function relStrengthFor(col) {
      const tb = parseFloat(state.bm.trapBar1RM[col]);
      const bw = parseFloat(state.bm.bodyweight[col] || activeBwKg());
      return (!isNaN(tb) && tb > 0 && !isNaN(bw) && bw > 0) ? (tb / bw) : null;
    }

    function getSummaryStats() {
      const done = DAYS_DATA.filter(d => state.dayDone[d.day]).length;
      let streak = 0, cur = 0;
      for (let i = 1; i <= 28; i++) { if (state.dayDone[i]) { cur++; if (cur > streak) streak = cur; } else cur = 0; }
      let preTot = 0, preDone = 0;
      PRE_PLAN.forEach(b => b.tasks.forEach(t => { preTot++; if (state.preChecks[t.id]) preDone++; }));
      const sleeps = [], cnss = [];
      let dojoHit = 0, dojoTot = 0, protHit = 0, carbHit = 0;
      DAYS_DATA.forEach(d => {
        if (d.dojoNote) dojoTot++;
        const c = state.checkIns[d.day];
        if (!c) return;
        if (c.sleep !== '' && !isNaN(+c.sleep)) sleeps.push(+c.sleep);
        if (c.cns !== '' && !isNaN(+c.cns)) cnss.push(+c.cns);
        if (d.dojoNote && c.dojo) dojoHit++;
        if (c.prot) protHit++;
        if (c.carb) carbHit++;
      });
      const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
      const rel = relStrengthFor('retest') || relStrengthFor('mid') || relStrengthFor('base');
      const r1 = parseFloat(state.bm.react1Cue.retest || state.bm.react1Cue.mid || state.bm.react1Cue.base);
      const r4 = parseFloat(state.bm.react4Cue.retest || state.bm.react4Cue.mid || state.bm.react4Cue.base);
      return {
        done, pct: Math.round((done / 28) * 100), streak,
        preDone, preTot, prePct: preTot ? Math.round((preDone / preTot) * 100) : 0,
        avgSleep: avg(sleeps), avgCns: avg(cnss), dojoHit, dojoTot, protHit, carbHit,
        rel, reactMs: !isNaN(r1) ? r1 : (!isNaN(r4) ? r4 : null)
      };
    }

      box.appendChild(el);

    function copyText(text, okMsg = 'Copied to clipboard!') {

        ta.value = text;

        document.body.appendChild(ta);
        ta.focus(); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);

    function wireAccordions(root) {
      root.querySelectorAll('[data-acc-toggle]').forEach(btn => {

            ${dObj.exercises.map((item, idx) => {
              const res = resolveExercise(item, dObj);

              const lib = res.lib;
              const ckKey = `d${dObj.day}_i${idx}`;
              const ck = !!state.exChecks[ckKey];
              const uid = `day_${dObj.day}_i${idx}`;
              const isNoneEq = lib.equipment.toLowerCase().startsWith('none');
              return `
                <div class="rounded-xl border border-hairline bg-[#0f131d] p-3.5 transition-colors ${ck ? 'border-emeraldK/40 bg-emeraldK/[0.04]' : (res.isSwapped ? 'border-amberK/30' : '')} ${expandedSet.has(uid) ? 'is-open' : ''}" data-acc-wrap>

                          <span class="font-mono text-[10px] px-2 py-0.5 rounded bg-crimson/15 text-crimson font-semibold inline-flex items-center gap-1">

                          ${item.syncMetric && !res.allowBenchmarkSync ? `<span class="font-mono text-[10px] px-2 py-0.5 rounded bg-white/5 text-slate-400 border border-hairline">Home log (keeps gym 1RM separate)</span>` : ''}

            <div class="rounded-xl p-4 border-l-4 border-l-crimson bg-crimson/[0.08] border border-crimson/25 flex flex-col sm:flex-row sm:items-center justify-between gap-3">

                <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${esc(dObj.dojoNote)}</p>

              <label class="flex items-center gap-2 px-3 py-2 rounded-xl bg-[#0d0f12] border border-hairline cursor-pointer shrink-0 min-h-[44px]">

                <span class="font-mono text-xs font-semibold ${ci.dojo ? 'text-emeraldK' : 'text-slate-200'}">Dojo Done</span>

              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">

                  <div class="font-mono text-[10px] text-emeraldK">${fuel.prot}</div>

                  <div class="font-mono text-[11px] font-bold text-slate-100">Carbs Hit</div>

            <div class="space-y-1.5">
              <div class="flex items-center justify-between font-mono text-[10px] uppercase text-slate-400">

                class="w-full rounded-xl p-2.5 text-xs sm:text-sm border border-hairline bg-[#0d0f12] text-slate-100 placeholder:text-slate-600">${esc(ci.note)}</textarea>
            </div>

          <div class="flex items-center justify-between pt-1">
            <button id="prevDy" type="button" ${dObj.day <= 1 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl font-mono text-xs border border-hairline bg-cardSub hover:border-crimson text-slate-200 disabled:opacity-30 min-h-[44px]">&larr; Day ${Math.max(1, dObj.day - 1)}</button>

      wireAccordions(el);

        state.selDay = +b.dataset.dy; saveState(); renderPlan28();
      }));
      document.getElementById('prevDy')?.addEventListener('click', () => {
        if (dObj.day > 1) { state.selDay = dObj.day - 1; state.selWeek = Math.ceil(state.selDay / 7); saveState(); renderPlan28(); }

        state.dayDone[dObj.day] = !state.dayDone[dObj.day];
        saveState(); renderPlan28();

        state.exChecks[e.target.dataset.ck] = e.target.checked;
        saveState(); renderPlan28();
      }));

      // Inline numeric inputs + automatic two-way sync to Tab 4 Benchmarks
      el.querySelectorAll('.ex-inp').forEach(inp => inp.addEventListener('change', e => {
        const lk = e.target.dataset.log;
        const slot = e.target.dataset.slot;
        const idx = +lk.split('_i')[1];
        const item = dObj.exercises[idx];
        const res = item ? resolveExercise(item, dObj) : null;
        const lib = res?.lib;
        if (!item || !lib) return;
        if (!state.exLogs[lk]) state.exLogs[lk] = {};

        if (slot === 'v2') {
          state.exLogs[lk].v2 = e.target.value === '' ? '' : parseInt(e.target.value, 10);
        } else {
          const kind = logKindOf(lib.logType);
          const canon = fCanon(kind, e.target.value);
          state.exLogs[lk].v1 = canon;
          if (item.syncMetric && res.allowBenchmarkSync && state.bm[item.syncMetric[0]]) {
            state.bm[item.syncMetric[0]][item.syncMetric[1]] = canon;
            if (canon !== '') toast('Synced to Numbers & Tracker ★');
          }
        }
        saveState();
      }));

      const getCi = () => {
        if (!state.checkIns[dObj.day]) {
          state.checkIns[dObj.day] = { bwKg: activeBwKg(), sleep: '', cns: '', dojo: false, prot: false, carb: false, note: '' };

        return state.checkIns[dObj.day];

          getCi().bwKg = kg;

          const col = dObj.day === 1 ? 'base' : (dObj.day === 14 ? 'mid' : (dObj.day === 27 ? 'retest' : null));

          saveState();
          toast(`Daily BW saved: ${mDisp(kg, state.unit)} ${uLbl('mass')}`);
        }
      });
      document.getElementById('ciSleep')?.addEventListener('change', e => { getCi().sleep = e.target.value === '' ? '' : parseFloat(e.target.value); saveState(); });

    function renderDeltaChart() {
      const pts = BENCHMARKS.filter(m => m.chart).map(m => {
        const b = state.bm[m.id].base;
        const l = state.bm[m.id].retest !== '' ? state.bm[m.id].retest : state.bm[m.id].mid;
        const d = calcDelta(m, b, l);
        if (!d) return null;
        const gain = m.up === false ? -d.pct : d.pct;
        return { short: m.short, gain: +gain.toFixed(1) };
      }).filter(Boolean);

      if (!pts.length) {
        return `<div class="rounded-xl panel-sub p-6 text-center text-xs font-mono text-slate-400">Enter Baseline (Day 1) plus Midpoint (Day 14) or Retest (Day 27) numbers to visualize your % speed gains.</div>`;
      }
      const maxAbs = Math.max(10, ...pts.map(p => Math.abs(p.gain)));
      const W = 560, H = 195, pL = 36, pR = 14, pT = 22, pB = 34;
      const zY = pT + (H - pT - pB) * 0.64;
      const upH = zY - pT, dnH = (H - pB) - zY;
      const step = (W - pL - pR) / pts.length, bw = Math.min(36, step * 0.56);

      return `
        <svg viewBox="0 0 ${W} ${H}" class="w-full h-48 rounded-xl bg-[#0b0d12] border border-hairline">
          <line x1="${pL}" y1="${zY}" x2="${W - pR}" y2="${zY}" stroke="#334155" stroke-width="1.5"/>
          <text x="6" y="${zY + 3}" font-size="9" fill="#94a3b8" font-family="JetBrains Mono">0%</text>
          ${pts.map((p, i) => {
            const cx = pL + step * i + step / 2;
            const pos = p.gain >= 0;
            const h = pos ? (Math.min(p.gain, maxAbs) / maxAbs) * upH : (Math.min(Math.abs(p.gain), maxAbs) / maxAbs) * dnH;
            const y = pos ? zY - h : zY;
            const col = pos ? '#10b981' : '#dc2626';
            return `
              <rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${Math.max(2, h)}" rx="4" fill="${col}" fill-opacity="0.9"/>
              <text x="${cx}" y="${pos ? y - 5 : y + h + 11}" text-anchor="middle" font-size="9" fill="${col}" font-family="JetBrains Mono" font-weight="700">${pos ? '+' : ''}${p.gain}%</text>
              <text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-family="JetBrains Mono">${esc(p.short)}</text>`;
          }).join('')}

        g.gain.setValueAtTime(0.18, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch (_) {}
    }

    function playHyoshigi(kind = 'beat') {
      const c = MAT_AUDIO.ctx();
      if (!c) return;
      const now = c.currentTime;
      if (kind === 'prep' || kind === 'prep_go') {
        const osc = c.createOscillator(), g = c.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(kind === 'prep_go' ? 1180 : 780, now);
        g.gain.setValueAtTime(0.18, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(g); g.connect(c.destination);
        osc.start(now); osc.stop(now + 0.065);
        return;
      }
      if (kind === 'accent') {
        // Resonant low kiai punch + sharp high double wooden clack
        const low = c.createOscillator(), lg = c.createGain();
        low.type = 'triangle';
        low.frequency.setValueAtTime(340, now);
        low.frequency.exponentialRampToValueAtTime(110, now + 0.11);
        lg.gain.setValueAtTime(0.36, now);
        lg.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        low.connect(lg); lg.connect(c.destination);
        low.start(now); low.stop(now + 0.13);

        const hi = c.createOscillator(), hg = c.createGain();
        hi.type = 'triangle';
        hi.frequency.setValueAtTime(1780, now);
        hi.frequency.exponentialRampToValueAtTime(920, now + 0.055);
        hg.gain.setValueAtTime(0.34, now);
        hg.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
        hi.connect(hg); hg.connect(c.destination);
        hi.start(now); hi.stop(now + 0.07);
        return;
      }
      // Crisp wooden hyoshigi clack
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1380, now);
      osc.frequency.exponentialRampToValueAtTime(720, now + 0.045);
      g.gain.setValueAtTime(0.32, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.052);
      osc.connect(g); g.connect(c.destination);
      osc.start(now); osc.stop(now + 0.058);
    }

    function buildCadenceTimeline() {
      const map = activeCadenceMap();
      const mult = 100 / Math.max(25, Math.min(115, CAD.speedPct)); // 25% -> 4x slower, 105% -> 0.952x faster
      const events = [];
      const beatEvents = [];
      const prepStep = 650; // 3-2-1 prep countdown
      events.push({ at: 0, kind: 'prep', label: '3...' });
      events.push({ at: prepStep, kind: 'prep', label: '2...' });
      events.push({ at: prepStep * 2, kind: 'prep_go', label: '1 — READY!' });
      const cursor = prepStep * 3;

      // Full Kata Mode: single continuous sequence from start to finish (zero phrases, exact real pauses)
      if (CAD.playMode === 'full') {
        const beats = map.fullKata?.beats || [];
        if (!beats.length) return { events: [], beatEvents: [], prepEndMs: cursor, lastBeatMs: cursor, endMs: 0 };
        beats.forEach((b, idx) => {
          const ev = {
            at: cursor + b.t * mult,
            kind: b.type || 'beat',
            trackId: 'full_kata',
            beatIdx: idx,
            label: b.type === 'accent' ? `KIME / KIAI! (#${idx + 1}/${beats.length})` : `MOVE ${idx + 1} / ${beats.length}`
          };
          events.push(ev);
          beatEvents.push(ev);
        });
        const lastBeatMs = beatEvents[beatEvents.length - 1].at;
        return { events, beatEvents, prepEndMs: cursor, lastBeatMs, endMs: lastBeatMs + 450 };
      }

      // Phrases Mode: isolated single phrase
      const ph = map.phrases[CAD.phraseIdx];
      if (!ph || !ph.beats.length) return { events: [], beatEvents: [], prepEndMs: cursor, lastBeatMs: cursor, endMs: 0 };
      ph.beats.forEach((b, idx) => {
        const ev = {
          at: cursor + b.t * mult,
          kind: b.type || 'beat',
          trackId: ph.id,
          beatIdx: idx,
          label: b.type === 'accent' ? `KIME / KIAI! (#${idx + 1}/${ph.beats.length})` : `MOVE ${idx + 1} / ${ph.beats.length}`
        };
        events.push(ev);
        beatEvents.push(ev);
      });
      const lastBeatMs = beatEvents[beatEvents.length - 1].at;
      return { events, beatEvents, prepEndMs: cursor, lastBeatMs, endMs: lastBeatMs + 450 };
    }

    function updateCadenceLiveDOM() {
      const btn = document.getElementById('cadPlayBtn');
      const st = document.getElementById('cadStageStatus');
      if (btn) {
        btn.textContent = CAD.playing ? '■ Stop Cadence' : `▶ Play ${CAD.playMode === 'full' ? 'Full Kata' : 'Phrase'} @ ${CAD.speedPct}%`;
        btn.className = `flex-1 min-h-[54px] px-5 rounded-xl font-mono text-sm font-extrabold transition-all shadow-lg ${CAD.playing ? 'bg-slate-700 text-white' : 'bg-crimson text-white hover:opacity-90 shadow-crimson/25'}`;
      }
      if (st) st.textContent = CAD.statusText;
      // Highlight active beat pill and keep it in view
      document.querySelectorAll('[data-bdot]').forEach(dot => {
        const on = CAD.playing && dot.dataset.btid === CAD.activeTrackId && Number(dot.dataset.bdot) === CAD.activeBeatIdx;
        dot.classList.toggle('ring-2', on);
        dot.classList.toggle('ring-white', on);
        dot.classList.toggle('scale-110', on);
        if (on) dot.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      });
    }

    function runCadencePass() {
      const tl = buildCadenceTimeline();
      if (!tl.events.length) {
        toast(CAD.playMode === 'full'
          ? 'No Full Kata beats recorded yet! Open Tap Video Tempo to record.'
          : 'No beats recorded for this phrase yet! Tap 🎙 Tap below to record.', true);
        stopCadencePlay();
        return;
      }
      CAD.runEvents = tl.events;
      CAD.beatEvents = tl.beatEvents;
      CAD.prepEndMs = tl.prepEndMs;
      CAD.lastBeatMs = tl.lastBeatMs;
      CAD.runEndMs = tl.endMs;
      CAD.nextEvtIdx = 0;
      CAD.runStartPerf = performance.now();
      CAD.activeBeatIdx = -1;
      CAD.statusText = '3...';
      updateCadenceLiveDOM();

      const totalBeats = CAD.beatEvents.length;
      const firstBeatAt = CAD.beatEvents[0].at;
      const totalKataSpan = Math.max(0, CAD.lastBeatMs - firstBeatAt);

      const step = (now) => {
        if (!CAD.playing) return;
        const elapsed = now - CAD.runStartPerf;
        while (CAD.nextEvtIdx < CAD.runEvents.length && CAD.runEvents[CAD.nextEvtIdx].at <= elapsed) {
          const ev = CAD.runEvents[CAD.nextEvtIdx++];
          if (ev.kind === 'prep' || ev.kind === 'prep_go') {
            playHyoshigi(ev.kind);
            CAD.statusText = ev.label;
            updateCadenceLiveDOM();
          } else {
            playHyoshigi(ev.kind);
            flashCadenceStage(ev.kind === 'accent');
            CAD.activeTrackId = ev.trackId;
            CAD.activeBeatIdx = ev.beatIdx;
            CAD.statusText = ev.label;
            updateCadenceLiveDOM();
          }
        }

        // Smooth 60fps updates for BOTH circular progress rings
        let progFrac = 0;
        if (elapsed >= firstBeatAt) {
          progFrac = totalKataSpan > 0 ? Math.min(1, (elapsed - firstBeatAt) / totalKataSpan) : 1;
        }
        const beatDone = Math.max(0, CAD.activeBeatIdx + 1);
        const kataElapsedSec = Math.max(0, (Math.min(elapsed, CAD.lastBeatMs) - firstBeatAt) / 1000);
        const kataTotalSec = totalKataSpan / 1000;

        let nextFrac = 0, nextCenter = 'READY', nextSub = '', nextLabel = 'TIME TO NEXT MOVE', nextTone = 'amber';
        if (elapsed < firstBeatAt) {
          // Prep countdown filling smoothly into Move #1
          nextFrac = firstBeatAt > 0 ? Math.min(1, elapsed / firstBeatAt) : 1;
          const rem = Math.max(0, (firstBeatAt - elapsed) / 1000);
          nextCenter = `${rem.toFixed(1)}s`;
          nextSub = 'Move #1 incoming';
          nextLabel = 'PREP COUNTDOWN';
          nextTone = 'sky';
        } else if (CAD.activeBeatIdx < totalBeats - 1) {
          // Smoothly fill circle across exact interval to the NEXT move in sequence
          const prevEv = CAD.beatEvents[Math.max(0, CAD.activeBeatIdx)];
          const nextEv = CAD.beatEvents[CAD.activeBeatIdx + 1];
          const segDur = Math.max(1, nextEv.at - prevEv.at);
          nextFrac = Math.max(0, Math.min(1, (elapsed - prevEv.at) / segDur));
          const rem = Math.max(0, (nextEv.at - elapsed) / 1000);
          nextCenter = rem >= 1 ? `${rem.toFixed(1)}s` : `${rem.toFixed(2)}s`;
          nextSub = nextEv.kind === 'accent'
            ? `Move #${CAD.activeBeatIdx + 2} · Kiai / Drop`
            : `Move #${CAD.activeBeatIdx + 2} of ${totalBeats}`;
          nextLabel = nextEv.kind === 'accent' ? 'NEXT: ACCENT / KIAI' : 'TIME TO NEXT MOVE';
          nextTone = nextEv.kind === 'accent' ? 'crimson' : 'amber';
        } else {
          // Final move hit — hold kime
          nextFrac = 1;
          nextCenter = 'KIME!';
          nextSub = 'Sequence complete';
          nextLabel = 'HOLD FINISH';
          nextTone = 'emerald';
        }

        updateCadenceRings({
          progFrac,
          progCenter: `${Math.round(progFrac * 100)}%`,
          progSub: `Move ${beatDone}/${totalBeats} · ${kataElapsedSec.toFixed(1)}s / ${kataTotalSec.toFixed(1)}s`,
          progTone: progFrac >= 0.999 ? 'emerald' : 'crimson',
          nextFrac,
          nextCenter,
          nextSub,
          nextLabel,
          nextTone
        });

        if (elapsed >= CAD.runEndMs) {
          CAD.loopCount++;
          // Full Kata ALWAYS plays once start-to-finish (no auto-loop); Phrases loop if reset pause > 0
          if (CAD.playMode === 'phrase' && CAD.loopPauseSec > 0) {
            CAD.activeBeatIdx = -1;
            const pauseMs = CAD.loopPauseSec * 1000;
            const pauseStart = performance.now();
            CAD.statusText = `Rep #${CAD.loopCount} done — Relax 0%`;
            updateCadenceLiveDOM();

            const stepPause = (pNow) => {
              if (!CAD.playing) return;
              const pElapsed = pNow - pauseStart;
              const pRem = Math.max(0, (pauseMs - pElapsed) / 1000);
              const pFrac = Math.min(1, pElapsed / pauseMs);
              updateCadenceRings({
                progFrac: 1,
                progCenter: '100%',
                progSub: `Rep #${CAD.loopCount} Complete`,
                progTone: 'emerald',
                nextFrac: pFrac,
                nextCenter: `${pRem.toFixed(1)}s`,
                nextSub: 'Shake arms loose (0%)',
                nextLabel: 'RELAX RESET',
                nextTone: 'emerald'
              });
              if (pElapsed >= pauseMs) {
                runCadencePass();
                return;
              }
              CAD.rafId = requestAnimationFrame(stepPause);
            };
            CAD.rafId = requestAnimationFrame(stepPause);
          } else {
            stopCadencePlay();
            toast(CAD.playMode === 'full' ? 'Full Kata cadence complete!' : 'Phrase cadence finished!');
          }
          return;
        }
        CAD.rafId = requestAnimationFrame(step);
      };
      CAD.rafId = requestAnimationFrame(step);
    }

    function toggleCadencePlay() {
      if (CAD.recording) { toast('Finish Tap-Along Recording first!', true); return; }
      if (CAD.playing) { stopCadencePlay(); return; }
      CAD.playing = true;
      CAD.loopCount = 0;
      requestWakeLock();
      runCadencePass();
    }

    /* ----------------------------------------------------------------------
       TAP-ALONG VIDEO RECORDER (DEFAULT 0.25x -> AUTO-NORMALIZED 1.0x MS)
       ---------------------------------------------------------------------- */
    function startCadenceRec(scope = 'full', targetPhraseIdx = null) {
      stopCadencePlay();
      const map = activeCadenceMap();
      CAD.recOpen = true;
      CAD.recScope = scope;
      CAD.playMode = scope;
      if (scope === 'phrase') {
        CAD.recPhraseIdx = targetPhraseIdx != null ? targetPhraseIdx : CAD.phraseIdx;
        CAD.phraseIdx = CAD.recPhraseIdx;
      }
      CAD.recording = true;
      CAD.recAnchorSec = null;
      CAD.recAnchorPerf = null;
      CAD.recBeats = [];

      const vid = document.getElementById('cadVideo');
      const hasVid = !!(vid && cadenceVideoSrc());
      CAD.recUsingVideo = hasVid;

      if (hasVid) {
        const startSec = scope === 'full' ? map.fullKata?.videoStartSec : map.phrases[CAD.recPhraseIdx]?.videoStartSec;
        if (startSec != null && vid.duration) {
          vid.currentTime = Math.max(0, startSec - 1.0);
        }
        vid.playbackRate = CAD.recSpeed;
        vid.play().catch(() => {});
      }
      renderVideoLab();
      toast(hasVid
        ? `Recording ${scope === 'full' ? 'Full Kata' : `Phrase #${CAD.recPhraseIdx + 1}`} @ ${CAD.recSpeed}x! Tap BEAT (or Space) on every move.`
        : `Live Tap Recording @ ${CAD.recSpeed}x! Tap BEAT (or Space) in rhythm.`);
    }

    function commitRecTrack() {
      const map = activeCadenceMap();
      if (!CAD.recBeats.length) return;
      const cleanBeats = CAD.recBeats.map(b => ({ t: Math.max(0, Math.round(b.t)), type: b.type }));
      if (CAD.recScope === 'full') {
        map.fullKata.beats = cleanBeats;
        if (CAD.recUsingVideo && CAD.recAnchorSec != null) map.fullKata.videoStartSec = +CAD.recAnchorSec.toFixed(3);
      } else {
        const ph = map.phrases[CAD.recPhraseIdx];
        if (ph) {
          ph.beats = cleanBeats;
          if (CAD.recUsingVideo && CAD.recAnchorSec != null) ph.videoStartSec = +CAD.recAnchorSec.toFixed(3);
        }
      }
      saveState();
    }

    function recordTap(type = 'beat') {
      if (!CAD.recording) return;
      playHyoshigi(type);
      const vid = document.getElementById('cadVideo');
      const useVid = !!(vid && cadenceVideoSrc());
      CAD.recUsingVideo = useVid;

      let tMs = 0;
      if (useVid) {
        const curSec = vid.currentTime || 0;
        if (CAD.recAnchorSec == null) CAD.recAnchorSec = curSec;
        tMs = Math.max(0, Math.round((curSec - CAD.recAnchorSec) * 1000));
      } else {
        const now = performance.now();
        if (CAD.recAnchorPerf == null) CAD.recAnchorPerf = now;
        tMs = Math.max(0, Math.round((now - CAD.recAnchorPerf) * CAD.recSpeed));
      }

      CAD.recBeats.push({ t: tMs, type });
      updateRecLiveStrip();
    }

    function undoRecTap() {
      if (!CAD.recording || !CAD.recBeats.length) return;
      CAD.recBeats.pop();
      if (!CAD.recBeats.length) { CAD.recAnchorSec = null; CAD.recAnchorPerf = null; }
      updateRecLiveStrip();
      toast('Removed last beat');
    }

    function stopCadenceRec(saveCurrent = true) {
      if (saveCurrent && CAD.recording) commitRecTrack();
      CAD.recording = false;
      const vid = document.getElementById('cadVideo');
      if (vid && !vid.paused) vid.pause();
      if (saveCurrent) {
        saveState();
        renderVideoLab();
        toast(`${CAD.recScope === 'full' ? 'Full Kata' : 'Phrase'} cadence saved & auto-normalized to true 1.0x speed!`);
      }
    }

    function updateRecLiveStrip() {
      const strip = document.getElementById('cadRecLive');
      const cnt = document.getElementById('cadRecCnt');
      if (cnt) cnt.textContent = `${CAD.recBeats.length} beat${CAD.recBeats.length === 1 ? '' : 's'} (1.0x)`;
      if (!strip) return;
      if (!CAD.recBeats.length) {
        strip.innerHTML = `<span class="font-mono text-[11px] text-slate-500">Tap BEAT or ACCENT/KIAI on the first move to anchor 0ms...</span>`;
        return;
      }
      strip.innerHTML = CAD.recBeats.map((b, i) => `
        <span class="px-2 py-0.5 rounded font-mono text-[10px] font-bold shrink-0 ${b.type === 'accent' ? 'bg-crimson text-white' : 'bg-amberK/20 text-amberK border border-amberK/40'}">
          #${i + 1} ${(b.t / 1000).toFixed(2)}s
        </span>`).join('');
      strip.scrollLeft = strip.scrollWidth;
    }

    // Keyboard hotkeys for zero-latency desktop tapping while watching video
    document.addEventListener('keydown', (e) => {
      if (!CAD.recording || state.activeTab !== 'videolab' || VLAB.subTab !== 'cadence') return;
      if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); recordTap('beat'); }
      else if (e.code === 'KeyK' || e.code === 'Enter') { e.preventDefault(); recordTap('accent'); }
      else if (e.code === 'KeyZ') { e.preventDefault(); undoRecTap(); }
      else if (e.code === 'KeyP') {
        e.preventDefault();
        const vid = document.getElementById('cadVideo');
        if (vid && cadenceVideoSrc()) {
          if (vid.paused) { vid.playbackRate = CAD.recSpeed; vid.play(); } else vid.pause();
        }
      }
    });

          <!-- Speed Scaling Controls (25% Early Learning -> 115% Overspeed) -->

                <div class="relative w-40 h-40 sm:w-44 sm:h-44 flex items-center justify-center">
                  <svg viewBox="0 0 140 140" class="w-full h-full">
                    <circle cx="70" cy="70" r="44" fill="none" stroke="#1f2738" stroke-width="1.5" stroke-dasharray="2 6"/>
                    <circle cx="70" cy="70" r="${CAD_RING_R}" fill="none" stroke="#1b2232" stroke-width="9"/>
                    <circle id="cadRingProg" cx="70" cy="70" r="${CAD_RING_R}" fill="none" stroke="url(#cadGradCrimson)" stroke-width="9" stroke-linecap="round"
                      stroke-dasharray="${CAD_RING_C}" stroke-dashoffset="${CAD_RING_C}" transform="rotate(-90 70 70)" class="cad-ring-glow-crimson"/>
                  </svg>
                  <div class="absolute inset-0 flex flex-col items-center justify-center px-3">
                    <span id="cadRingProgVal" class="font-mono tabular-nums text-2xl sm:text-3xl font-extrabold text-slate-100 leading-none">0%</span>
                    <span id="cadRingProgSub" class="font-mono text-[10px] text-slate-400 mt-1.5">0 / ${activeBeats.length} moves</span>
                  </div>
                </div>
              </div>

              <!-- CIRCLE 2: TIME UNTIL NEXT MOVE IN SEQUENCE -->
              <div id="cadNextDialWrap" class="cad-dial rounded-2xl border border-hairline p-4 flex flex-col items-center justify-center text-center">
                <div id="cadRingNextLbl" class="font-mono text-[10px] uppercase tracking-widest font-bold text-amberK mb-2">NEXT MOVE TIMER</div>
                <div class="relative w-40 h-40 sm:w-44 sm:h-44 flex items-center justify-center">
                  <svg viewBox="0 0 140 140" class="w-full h-full">
                    <circle cx="70" cy="70" r="44" fill="none" stroke="#1f2738" stroke-width="1.5" stroke-dasharray="2 6"/>
                    <circle cx="70" cy="70" r="${CAD_RING_R}" fill="none" stroke="#1b2232" stroke-width="9"/>
                    <circle id="cadRingNext" cx="70" cy="70" r="${CAD_RING_R}" fill="none" stroke="url(#cadGradAmber)" stroke-width="9" stroke-linecap="round"
                      stroke-dasharray="${CAD_RING_C}" stroke-dashoffset="${CAD_RING_C}" transform="rotate(-90 70 70)" class="cad-ring-glow-amber"/>
                  </svg>
                  <div class="absolute inset-0 flex flex-col items-center justify-center px-3">
                    <span id="cadRingNextVal" class="font-mono tabular-nums text-2xl sm:text-3xl font-extrabold text-amberK leading-none">${activeBeats.length ? `${CAD.speedPct}%` : '—'}</span>
                    <span id="cadRingNextSub" class="font-mono text-[10px] text-slate-400 mt-1.5">${activeBeats.length ? 'Fills to next move' : 'No beats yet'}</span>
                  </div>
                </div>
              </div>
            </div>

            ${activeBeats.length ? `
              <div class="flex flex-wrap items-center justify-center gap-1.5 pt-1 max-h-24 overflow-y-auto px-1">
                ${activeBeats.map((b, i) => `
                  <span data-bdot="${i}" data-btid="${activeTrackId}" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full font-mono text-[10px] font-bold transition-transform ${b.type === 'accent' ? 'bg-crimson/20 text-crimson border border-crimson/50' : 'bg-amberK/15 text-amberK border border-amberK/35'}">
                    #${i + 1} ${((b.t * (100 / CAD.speedPct)) / 1000).toFixed(2)}s
                  </span>`).join('')}
              </div>` : `
              <div class="font-mono text-xs text-slate-500 text-center pt-1">
                ${isFull ? 'No Full Kata rhythm recorded yet — click 🎙 Tap Video Tempo (0.25x) above to record start-to-finish.' : 'No beats in this phrase yet — click 🎙 Tap on any phrase below.'}
              </div>`}
          </div>

          <div class="flex flex-col sm:flex-row gap-2.5">
            <button id="cadPlayBtn" type="button" class="flex-1 min-h-[54px] px-5 rounded-xl font-mono text-sm font-extrabold shadow-lg ${CAD.playing ? 'bg-slate-700 text-white' : 'bg-crimson text-white hover:opacity-90 shadow-crimson/25'}">
              ${CAD.playing ? '■ Stop Cadence' : `▶ Play ${isFull ? 'Full Kata' : 'Phrase'} @ ${CAD.speedPct}%`}
            </button>
            <button id="cadMarkCleanBtn" type="button" class="min-h-[54px] px-4 rounded-xl font-mono text-xs font-extrabold bg-emeraldK/15 text-emeraldK border border-emeraldK/40 hover:bg-emeraldK hover:text-[#0d0f12] transition-colors shrink-0">
              ✓ Log ${isFull ? 'Full Kata' : 'Phrase'} Clean @ ${CAD.speedPct}%
            </button>
          </div>
        </div>

        <!-- ISOLATED PHRASES LIST (ONLY SHOWN IN PHRASES TAB — COMPLETELY SEPARATE FROM FULL KATA) -->
        ${!isFull ? `
          <div class="panel-card rounded-2xl p-4 sm:p-5 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="font-bold text-base text-slate-100">Isolated Kata Phrases (${map.phrases.length})</h2>
                <p class="text-xs text-slate-400">Completely separate from Full Kata. Tap any phrase to isolate &amp; loop it, or hit <strong>🎙 Tap</strong> to record just that phrase at 0.25x.</p>
              </div>
              <div class="flex items-center gap-2">
                <span class="font-mono text-xs text-emeraldK font-bold">Phrases Avg Clean: ${avgPhClean}%</span>
                <button id="cadAddPhraseBtn" type="button" class="px-3 py-1.5 rounded-lg font-mono text-xs font-bold border border-hairline bg-cardSub hover:border-skyK text-skyK min-h-[36px]">+ Phrase</button>
              </div>
            </div>

            <div class="space-y-2">
              ${map.phrases.map((ph, idx) => {
                const sel = idx === CAD.phraseIdx;
                const hasBeats = ph.beats.length > 0;
                const dur1x = hasBeats ? (ph.beats[ph.beats.length - 1].t / 1000).toFixed(2) : null;
                return `
                  <div class="rounded-xl border p-3 transition-colors ${sel ? 'border-crimson bg-crimson/[0.07]' : 'border-hairline bg-[#0f131d] hover:border-slate-500'}">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                      <button type="button" data-selph="${idx}" class="selph-btn flex-1 text-left min-w-0">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="font-semibold text-sm text-slate-100">${esc(ph.name)}</span>
                          ${ph.cleanPct ? `<span class="px-2 py-0.5 rounded-full font-mono text-[10px] font-bold bg-emeraldK/15 text-emeraldK border border-emeraldK/35">Clean @ ${ph.cleanPct}%</span>` : ''}
                        </div>
                        <div class="font-mono text-[11px] text-slate-400 mt-0.5">
                          ${hasBeats ? `${ph.beats.length} beats · ${dur1x}s @ 100%` : 'Not tapped yet — click 🎙 Tap to record at 0.25x'}
                        </div>
                      </button>
                      <div class="flex items-center gap-1.5 shrink-0">
                        <button type="button" data-recph="${idx}" class="recph-btn px-3 py-2 rounded-lg font-mono text-[11px] font-bold bg-amberK/15 text-amberK border border-amberK/35 hover:bg-amberK hover:text-[#0d0f12] min-h-[38px]">🎙 Tap</button>
                        ${hasBeats ? `<button type="button" data-playph="${idx}" class="playph-btn px-3 py-2 rounded-lg font-mono text-[11px] font-bold bg-crimson/15 text-crimson border border-crimson/35 hover:bg-crimson hover:text-white min-h-[38px]">▶ Loop</button>` : ''}
                        ${map.phrases.length > 1 ? `<button type="button" data-delph="${idx}" title="Delete phrase" class="delph-btn px-2.5 py-2 rounded-lg font-mono text-[11px] border border-hairline text-slate-400 hover:text-crimson min-h-[38px]">✕</button>` : ''}
                      </div>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>` : ''}`;
    }

    function wireCadenceMapper(el) {
      resetCadenceRingsToIdle();

      el.querySelectorAll('.cmap-btn').forEach(b => b.addEventListener('click', () => {
        stopCadencePlay();
        if (CAD.recording) stopCadenceRec(true);
        state.activeCadenceMapId = b.dataset.cmap;
        CAD.phraseIdx = 0;
        saveState();
        renderVideoLab();
      }));

      document.getElementById('cadBackupBtn')?.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `kime_hub_backup_${isoOffset(0)}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('Backup downloaded! Your tapped beats are safe.');
      });

      document.getElementById('cadNewMapBtn')?.addEventListener('click', () => {
        const isPersonal = activeCadenceMap().role === 'pro';
        const n = state.cadenceMaps.length + 1;
        const newMap = {
          id: `cm_${Date.now()}`,
          name: isPersonal ? `Chatanyara — My Personal Baseline #${n}` : `Chatanyara — Pro Reference #${n}`,
          kata: 'Chatanyara Kushanku',
          role: isPersonal ? 'personal' : 'pro',
          notes: isPersonal ? 'Tap your own cleanest max run to unlock true 105% personal overspeed.' : 'Pro reference tempo map.',
          fullKata: { beats: [], cleanPct: 0, videoStartSec: null },
          fullKataMigrated: true,
          phrases: defaultCadenceMaps()[1].phrases.map(p => ({ ...p, id: `p_${Date.now()}_${Math.random().toString(36).slice(2,6)}`, beats: [] }))
        };
        state.cadenceMaps.push(newMap);
        state.activeCadenceMapId = newMap.id;
        CAD.phraseIdx = 0;
        saveState(); renderVideoLab();
        toast(`Created "${newMap.name}"`);
      });

      document.getElementById('cadOpenRecBtn')?.addEventListener('click', () => {
        if (CAD.recording) stopCadenceRec(true);
        CAD.recOpen = !CAD.recOpen;
        renderVideoLab();
      });

      document.getElementById('cadVidFile')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (CAD.recVideoUrl) { try { URL.revokeObjectURL(CAD.recVideoUrl); } catch (_) {} }
        CAD.recVideoUrl = URL.createObjectURL(file);
        CAD.recVideoName = file.name;
        renderVideoLab();
        toast(`Video loaded for ${CAD.recSpeed}x tap-along!`);
      });

      const cv = document.getElementById('cadVideo');
      if (cv) {
        cv.playbackRate = CAD.recSpeed;
        cv.addEventListener('play', () => { cv.playbackRate = CAD.recSpeed; });
      }

      el.querySelectorAll('.recsp-btn').forEach(b => b.addEventListener('click', () => {
        CAD.recSpeed = Number(b.dataset.recsp);
        const v = document.getElementById('cadVideo');
        if (v) v.playbackRate = CAD.recSpeed;
        renderVideoLab();
      }));

      document.getElementById('cadStartFullRec')?.addEventListener('click', () => startCadenceRec('full'));
      document.getElementById('cadStartPhraseRec')?.addEventListener('click', () => startCadenceRec('phrase', CAD.phraseIdx));
      document.getElementById('cadTapBeat')?.addEventListener('pointerdown', (e) => { e.preventDefault(); recordTap('beat'); });
      document.getElementById('cadTapAccent')?.addEventListener('pointerdown', (e) => { e.preventDefault(); recordTap('accent'); });
      document.getElementById('cadUndoTap')?.addEventListener('click', undoRecTap);
      document.getElementById('cadStopRec')?.addEventListener('click', () => stopCadenceRec(true));
      if (CAD.recording) updateRecLiveStrip();

      el.querySelectorAll('.pmode-btn').forEach(b => b.addEventListener('click', () => {
        stopCadencePlay();
        if (CAD.recording) stopCadenceRec(true);
        CAD.playMode = b.dataset.pmode;
        CAD.recScope = b.dataset.pmode;
        renderVideoLab();
      }));
      document.getElementById('cadLoopSel')?.addEventListener('change', e => { CAD.loopPauseSec = Number(e.target.value); });

      const setSp = (v) => {
        const clamped = Math.max(25, Math.min(115, Math.round(v / 5) * 5));
        CAD.speedPct = clamped;
        const wasPlaying = CAD.playing;
        if (wasPlaying) stopCadencePlay();
        renderVideoLab();
        if (wasPlaying) toggleCadencePlay();
      };
      document.getElementById('cadMinus5')?.addEventListener('click', () => setSp(CAD.speedPct - 5));
      document.getElementById('cadPlus5')?.addEventListener('click', () => setSp(CAD.speedPct + 5));
      document.getElementById('cadSpeedSlider')?.addEventListener('input', e => setSp(Number(e.target.value)));
      el.querySelectorAll('.csp-btn').forEach(b => b.addEventListener('click', () => setSp(Number(b.dataset.csp))));

      document.getElementById('cadPlayBtn')?.addEventListener('click', toggleCadencePlay);
      document.getElementById('cadMarkCleanBtn')?.addEventListener('click', () => {
        const map = activeCadenceMap();
        if (CAD.playMode === 'full') {
          map.fullKata.cleanPct = Math.max(map.fullKata.cleanPct || 0, CAD.speedPct);
          toast(`Logged Full Kata clean @ ${CAD.speedPct}%!`);
        } else {
          const ph = map.phrases[CAD.phraseIdx];
          if (ph) ph.cleanPct = Math.max(ph.cleanPct || 0, CAD.speedPct);
          toast(`Logged "${ph?.name}" clean @ ${CAD.speedPct}%!`);
        }
        saveState(); renderVideoLab();
      });

      document.getElementById('cadAddPhraseBtn')?.addEventListener('click', () => {
        const map = activeCadenceMap();
        const n = map.phrases.length + 1;
        map.phrases.push({ id: `ph_${Date.now()}`, name: `${n}. Custom Chatanyara Sequence`, note: 'Isolated flurry', cleanPct: 0, gapAfterMs: 1200, videoStartSec: null, beats: [] });
        CAD.phraseIdx = map.phrases.length - 1;
        saveState(); renderVideoLab();
      });

      el.querySelectorAll('.selph-btn').forEach(b => b.addEventListener('click', () => {
        stopCadencePlay();
        CAD.phraseIdx = Number(b.dataset.selph);
        CAD.playMode = 'phrase';
        renderVideoLab();
      }));
      el.querySelectorAll('.recph-btn').forEach(b => b.addEventListener('click', () => {
        startCadenceRec('phrase', Number(b.dataset.recph));
      }));
      el.querySelectorAll('.playph-btn').forEach(b => b.addEventListener('click', () => {
        stopCadencePlay();
        CAD.phraseIdx = Number(b.dataset.playph);
        CAD.playMode = 'phrase';
        renderVideoLab();
        toggleCadencePlay();
      }));
      el.querySelectorAll('.delph-btn').forEach(b => b.addEventListener('click', () => {
        const map = activeCadenceMap();
        if (map.phrases.length <= 1) return;
        const idx = Number(b.dataset.delph);
        map.phrases.splice(idx, 1);
        if (CAD.phraseIdx >= map.phrases.length) CAD.phraseIdx = map.phrases.length - 1;
        saveState(); renderVideoLab();
      }));
    }

    function vlabCalc() {
      if (VLAB.tA == null || VLAB.tB == null) return null;
      const start = Math.min(VLAB.tA, VLAB.tB);
      const end = Math.max(VLAB.tA, VLAB.tB);
      const sec = Math.max(0, end - start);
      const ms = Math.round(sec * 1000);
      const frames = Math.round(sec * VLAB.fps);
      return { start, end, sec, ms, frames };
    }

    function seekVideoTo(video, targetSec) {
      return new Promise(resolve => {
        const clamped = Math.max(0, Math.min(video.duration || 0, targetSec));
        if (Math.abs(video.currentTime - clamped) < 0.0005) {
          resolve();
          return;
        }
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          video.removeEventListener('seeked', finish);
          clearTimeout(guard);
          resolve();
        };
        const guard = setTimeout(finish, 900);
        video.addEventListener('seeked', finish, { once: true });
        video.currentTime = clamped;
      });
    }

      const frTxt = calc ? `${calc.frames} frames @ ${VLAB.fps} fps` : `[at ${VLAB.fps} fps]`;

    async function generateFilmstripPNG() {
      const video = document.getElementById('vlabVideo');
      if (!video || !VLAB.objectUrl || !video.videoWidth) {
        toast('Load a local video clip first!', true);
        return;
      }
      const calc = vlabCalc();
      if (!calc || calc.sec < 0.015) {
        toast('Mark distinct Start (A) and Impact (B) frames first!', true);
        return;
      }
      if (VLAB.generating) return;

      VLAB.generating = true;
      VLAB.progressText = 'Initializing canvas...';
      updateVlabProgressUI();

      try {
        video.pause();
        const savedTime = video.currentTime;
        const N = VLAB.density;
        const cols = N === 9 ? 3 : (N === 12 ? 4 : 5);
        const rows = 3;

        const aspect = video.videoWidth / video.videoHeight;
        const tileW = 360;
        const tileH = Math.max(200, Math.min(480, Math.round(tileW / Math.max(0.55, Math.min(1.9, aspect)))));
        const pad = 10;
        const headerH = 98;
        const canvasW = pad + cols * (tileW + pad);
        const canvasH = headerH + pad + rows * (tileH + pad);

        const canvas = document.createElement('canvas');
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = '#0d0f12';
        ctx.fillRect(0, 0, canvasW, canvasH);

        // Header Banner
        ctx.fillStyle = '#131722';
        ctx.fillRect(0, 0, canvasW, headerH);
        ctx.fillStyle = '#e11d48';
        ctx.fillRect(0, headerH - 4, canvasW, 4);

        const f2 = getFueling(true);
        ctx.fillStyle = '#e11d48';
        ctx.font = '700 16px "JetBrains Mono", monospace';
        ctx.fillText(`KIME // 60FPS VIDEO LAB  ·  ${VLAB.mode.toUpperCase()}`, 20, 32);

        ctx.fillStyle = '#f1f5f9';
        ctx.font = '700 22px Inter, system-ui, sans-serif';
        ctx.fillText(VLAB.label || 'Transition Analysis', 20, 62);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 13px "JetBrains Mono", monospace';
        ctx.fillText(`A→B: ${calc.ms} ms | ${calc.frames} frames @ ${VLAB.fps} fps | Grid: ${N}f (${cols}x${rows}) | BW: ${f2.lbs} lbs (${f2.kg.toFixed(1)} kg)`, 20, 84);

        for (let i = 0; i < N; i++) {
          const frac = N > 1 ? i / (N - 1) : 0;
          const t = calc.start + frac * calc.sec;
          VLAB.progressText = `Capturing frame ${i + 1} / ${N}...`;
          updateVlabProgressUI();

          await seekVideoTo(video, t);
          await new Promise(r => requestAnimationFrame(r));

          const col = i % cols;
          const row = Math.floor(i / cols);
          const x = pad + col * (tileW + pad);
          const y = headerH + pad + row * (tileH + pad);

          // Tile container
          ctx.fillStyle = '#050608';
          ctx.fillRect(x, y, tileW, tileH);

          // Fit video cleanly preserving aspect ratio
          const scale = Math.min(tileW / video.videoWidth, tileH / video.videoHeight);
          const dw = video.videoWidth * scale;
          const dh = video.videoHeight * scale;
          const dx = x + (tileW - dw) / 2;
          const dy = y + (tileH - dh) / 2;
          ctx.drawImage(video, dx, dy, dw, dh);

          // Tile hairline border
          ctx.strokeStyle = i === 0 ? '#10b981' : (i === N - 1 ? '#e11d48' : '#2a3245');
          ctx.lineWidth = (i === 0 || i === N - 1) ? 2.5 : 1.2;
          ctx.strokeRect(x + 0.5, y + 0.5, tileW - 1, tileH - 1);

          // High-contrast top-left badge: "#1 | +0ms | f0"
          const relMs = Math.round((t - calc.start) * 1000);
          const relFr = Math.round((t - calc.start) * VLAB.fps);
          const badgeTxt = `#${i + 1} | +${relMs}ms | f${relFr}`;
          ctx.font = '700 13px "JetBrains Mono", monospace';
          const tw = ctx.measureText(badgeTxt).width;
          ctx.fillStyle = 'rgba(13, 15, 18, 0.88)';
          ctx.fillRect(x + 6, y + 6, tw + 14, 24);
          ctx.strokeStyle = i === 0 ? '#10b981' : (i === N - 1 ? '#e11d48' : '#f59e0b');
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 6, y + 6, tw + 14, 24);
          ctx.fillStyle = i === 0 ? '#10b981' : (i === N - 1 ? '#fb7185' : '#f8fafc');
          ctx.fillText(badgeTxt, x + 13, y + 22);
        }

        await seekVideoTo(video, savedTime);
        VLAB.dataUrl = canvas.toDataURL('image/png');
        VLAB.lastStats = { ...calc };
        VLAB.generating = false;
        VLAB.progressText = '';
        renderVideoLab();
        toast(`Generated ${N}-frame timestamped filmstrip PNG!`);
      } catch (err) {
        console.error('Filmstrip generation failed:', err);
        VLAB.generating = false;
        VLAB.progressText = '';
        updateVlabProgressUI();
        toast('Could not extract frames—try a standard MP4/MOV clip.', true);
      }
    }

    /* ======================================================================
       12C. HANDS-FREE "MAT MODE" OVERLAY ENGINE (REST & CONTRAST TIMER)
       ====================================================================== */
    const MAT_PRESETS = {
      contrast: {
        title: 'Preset: Contrast Pair (60s / 180s)',
        steps: [{
          title: 'Heavy Compound Lift', contrastTitle: 'Explosive Jump / Throw',
          rx: '4 x (3 Heavy + 60s + 3 Explosive) · 3m full rest',
